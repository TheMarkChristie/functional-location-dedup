name: Publish Functional Location De-duplicator to npm

# Publishes the Power Platform ToolBox package (pptb/) to npm using npm Trusted
# Publishing (OIDC). No npm token and no repo secret is involved: the `id-token: write`
# permission mints a short-lived OIDC token that npm exchanges for publish rights, and
# provenance attestations are generated automatically.
#
# The trusted-publisher record on npmjs.com is bound to this exact file name
# (.github/workflows/publish-npm.yml). Renaming this file breaks publishing.

on:
  release:
    types: [published]      # a published GitHub Release publishes automatically
  workflow_dispatch:        # ...or run it by hand from the Actions tab

permissions:
  id-token: write           # required: mints the OIDC token npm trades for publish rights
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # ships npm >= 11.5.1, the minimum for trusted publishing
          registry-url: 'https://registry.npmjs.org'

      # Regenerates pptb/dist from the canonical web resource HTML + shared stylesheet.
      # pptb/dist is gitignored, so this step is what creates the files npm ships.
      # The package has zero dependencies, so there is deliberately no `npm ci`.
      - name: Build the ToolBox package
        working-directory: pptb
        run: npm run build

      - name: Publish
        working-directory: pptb
        run: npm publish --access public
